name: Release

# A release is made on purpose: raise "version" in manifest.json, commit, then push a
# tag with that version (for example 1.0.7). The tests run first. Publishing then WAITS
# for a manual approval (the "release" environment), so a tag pushed by mistake, or by
# anyone else, never reaches a device on its own. The plugin's updater installs the
# latest release only, never the main branch.
#
# "Run workflow" on the main branch is a dry run: it tests and builds the zip, publishes nothing.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The tag must match the version in manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $v"
            exit 1
          fi
      - run: npm test
      - name: Build the download zip (the README links to it)
        run: |
          mkdir vr-writing-mode
          cp main.js manifest.json styles.css vr-writing-mode/
          zip -r writing-mode.zip vr-writing-mode
      # The exact files that passed the tests are the ones that get published.
      - name: Keep the tested files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            main.js
            manifest.json
            styles.css
            writing-mode.zip
          if-no-files-found: error

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Waits here until you approve: GitHub > Actions > this run > "Review deployments".
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: The files must still match the tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "manifest.json says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css writing-mode.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
